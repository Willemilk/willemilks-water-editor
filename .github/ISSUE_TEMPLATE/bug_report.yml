name: Bug report
description: Something in the editor is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please fill in what you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I do X, the editor does Y instead of Z.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open game files ...
        2. Select level ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: dropdown
    id: mode
    attributes:
      label: How are you running it?
      options:
        - Desktop app (Electron)
        - Browser (npm run dev)
    validations:
      required: true
  - type: input
    id: editor-version
    attributes:
      label: Editor version
      placeholder: "e.g. v1.2.0"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Playtest log / console output
      description: If this is about playtesting, paste the log from the Playtest modal here.
      render: shell
    validations:
      required: false
